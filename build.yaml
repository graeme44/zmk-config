# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
# DIAGNOSTIC BUILD: both halves get USB CDC logging so the split pairing
# failure can be read over serial. Studio is dropped from the left half for
# this build to keep one log port per half. Do not merge to master.
include:
  - board: nice_nano//zmk
    shield: sofle_left nice_oled
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: sofle_right nice_oled
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: settings_reset
