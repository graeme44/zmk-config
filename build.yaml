# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
# DIAGNOSTIC BUILD: chasing a peripheral freeze a few seconds after boot.
# Left half logs over USB CDC. Three right-half variants isolate the cause:
#   nodisplay - no OLED shield at all; if the split holds, the display is at fault
#   bigmem    - LVGL pool and display thread stack raised to the central's values
#   immediate - synchronous logging, so a fatal fault is flushed before the halt
# Do not merge to master.
include:
  - board: nice_nano//zmk
    shield: sofle_left nice_oled
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: sofle_right
    snippet: zmk-usb-logging
    artifact-name: right-nodisplay
  - board: nice_nano//zmk
    shield: sofle_right nice_oled
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LV_Z_MEM_POOL_SIZE=8192 -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
    artifact-name: right-bigmem
  - board: nice_nano//zmk
    shield: sofle_right nice_oled
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: right-immediate
  - board: nice_nano//zmk
    shield: settings_reset
