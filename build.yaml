# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# ISOLATION TEST: left half only, no nice_oled module at all, ZMK's built-in
# status screen. If the panel renders readable text here, the OLED and its I2C
# bus are fine and nice_oled's 68x160 canvas was the whole problem.
include:
  - board: nice_nano_v2
    shield: sofle_left
    artifact-name: left-builtin-screen
